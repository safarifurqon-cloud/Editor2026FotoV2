<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Editor Foto Tampilator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: sans-serif;
    background: #f0f0f0;
    color: #222;
    padding-bottom: 90px;
  }
  header {
    background: #2c3e50;
    color: #fff;
    padding: 16px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 20px; }
  header .sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }

  #barIp {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: #34495e;
  }
  #barIp input {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
  }
  #barIp button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: #1abc9c;
    color: #fff;
    font-size: 14px;
  }

  #status {
    padding: 8px 14px;
    font-size: 13px;
    text-align: center;
    color: #555;
  }

  #daftar {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .kartu {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    overflow: hidden;
    display: flex;
  }
  .kartu .thumb-wrap {
    width: 160px;
    min-width: 160px;
    aspect-ratio: 16/9;
    background: #ddd;
    position: relative;
  }
  .kartu .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .kartu .thumb-wrap .noFoto {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #888;
    text-align: center;
    padding: 4px;
  }
  .kartu .isi {
    flex: 1;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .kartu .isi input[type="text"] {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  .kartu .baris-slider {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #555;
  }
  .kartu .baris-slider input[type="range"] {
    flex: 1;
  }
  .kartu .aksi {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .kartu .aksi button {
    flex: 1;
    padding: 7px 4px;
    font-size: 12px;
    border: none;
    border-radius: 6px;
    color: #fff;
    min-width: 60px;
  }
  .btn-ganti { background: #2980b9; }
  .btn-naik, .btn-turun { background: #7f8c8d; }
  .btn-hapus { background: #c0392b; }

  #tombolTambahWrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    padding: 10px 12px;
    box-shadow: 0 -2px 6px rgba(0,0,0,0.15);
    display: flex;
    gap: 10px;
  }
  #tombolTambahWrap button {
    flex: 1;
    padding: 14px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-weight: bold;
  }
  #btnTambah { background: #27ae60; }
  #btnSimpan { background: #e67e22; }
  #btnTambah:disabled, #btnSimpan:disabled { background: #bdc3c7; }

  .kosong {
    text-align: center;
    color: #888;
    padding: 30px 10px;
    font-size: 14px;
  }

  input[type="file"] { display: none; }
</style>
</head>
<body>

<header>
  <h1>EDITOR FOTO</h1>
  <div class="sub">Foto Album Kegiatan Masjid</div>
</header>

<div id="barIp">
  <input type="text" id="inputIp" placeholder="IP Tampilator, mis. 192.168.1.1">
  <button id="btnSambung">Sambung</button>
</div>

<div id="status">Menghubungkan ke Tampilator...</div>

<div id="daftar"></div>

<input type="file" id="inputFile" accept="image/*">

<div id="tombolTambahWrap">
  <button id="btnTambah">+ Tambah Foto</button>
  <button id="btnSimpan">Simpan</button>
</div>

<script>
// ==================== KONFIGURASI ====================
var PORT = 8080;
var LEBAR_MAKS_UTAMA = 1280;   // lebar maksimal foto utama (px), proporsional
var THUMB_W = 320;             // ukuran thumbnail preview (px)
var THUMB_H = 180;             // rasio 16:9 dipaksa (crop tengah)
var MAKS_FOTO = 30;
var KUALITAS_JPEG = 0.8;

var baseUrl = "";              // http://<ip>:8080
var daftarFoto = [];           // { id, caption, posisiY, thumbUrl, mainBlob, thumbBlob, isBaru }
var sedangEditId = null;       // id yang sedang menunggu hasil pilih foto (null = tambah baru)

// ==================== UTIL ====================
function elStatus(teks) {
  document.getElementById("status").textContent = teks;
}

function idBerikutnya() {
  for (var i = 1; i <= MAKS_FOTO; i++) {
    var dipakai = daftarFoto.some(function (f) { return f.id === i; });
    if (!dipakai) return i;
  }
  return null; // penuh
}

// resize proporsional (lebar maks LEBAR_MAKS_UTAMA), hasil Blob JPEG
function resizeUtama(file) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    img.onload = function () {
      var w = img.width, h = img.height;
      if (w > LEBAR_MAKS_UTAMA) {
        h = Math.round(h * (LEBAR_MAKS_UTAMA / w));
        w = LEBAR_MAKS_UTAMA;
      }
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      canvas.toBlob(function (blob) { resolve(blob); }, "image/jpeg", KUALITAS_JPEG);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

// thumbnail 16:9 dipaksa, crop dari TENGAH foto asli (bukan letterbox)
function buatThumbnail(file) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    img.onload = function () {
      var rasioTarget = THUMB_W / THUMB_H;
      var rasioAsli = img.width / img.height;
      var sx, sy, sw, sh;
      if (rasioAsli > rasioTarget) {
        sh = img.height;
        sw = sh * rasioTarget;
        sx = (img.width - sw) / 2;
        sy = 0;
      } else {
        sw = img.width;
        sh = sw / rasioTarget;
        sx = 0;
        sy = (img.height - sh) / 2;
      }
      var canvas = document.createElement("canvas");
      canvas.width = THUMB_W; canvas.height = THUMB_H;
      canvas.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, THUMB_W, THUMB_H);
      canvas.toBlob(function (blob) { resolve(blob); }, "image/jpeg", KUALITAS_JPEG);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

// ==================== RENDER DAFTAR ====================
function render() {
  var wadah = document.getElementById("daftar");
  wadah.innerHTML = "";

  if (daftarFoto.length === 0) {
    wadah.innerHTML = '<div class="kosong">Belum ada foto. Tekan "+ Tambah Foto" di bawah.</div>';
  }

  daftarFoto.forEach(function (foto, idx) {
    var kartu = document.createElement("div");
    kartu.className = "kartu";

    var thumbSrc = foto.previewUrl
      ? foto.previewUrl
      : (baseUrl ? baseUrl + "/Get_Photo_Thumb?id=" + foto.id + "&t=" + Date.now() : "");

    var thumbHtml = thumbSrc
      ? '<img src="' + thumbSrc + '" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
        '<div class="noFoto" style="display:none">Foto belum termuat</div>'
      : '<div class="noFoto">Belum ada foto</div>';

    kartu.innerHTML =
      '<div class="thumb-wrap">' + thumbHtml + '</div>' +
      '<div class="isi">' +
      '  <input type="text" class="inputCaption" placeholder="Caption foto ke-' + foto.id + '" value="' + (foto.caption || "").replace(/"/g, "&quot;") + '">' +
      '  <div class="baris-slider">' +
      '    <span>Atas</span>' +
      '    <input type="range" class="sliderPosisi" min="0" max="100" value="' + foto.posisiY + '">' +
      '    <span>Bawah</span>' +
      '  </div>' +
      '  <div class="aksi">' +
      '    <button class="btn-naik">▲ Naik</button>' +
      '    <button class="btn-turun">▼ Turun</button>' +
      '    <button class="btn-ganti">Ganti Foto</button>' +
      '    <button class="btn-hapus">Hapus</button>' +
      '  </div>' +
      '</div>';

    kartu.querySelector(".inputCaption").addEventListener("input", function (e) {
      foto.caption = e.target.value;
    });
    kartu.querySelector(".sliderPosisi").addEventListener("input", function (e) {
      foto.posisiY = parseInt(e.target.value, 10);
    });
    kartu.querySelector(".btn-hapus").addEventListener("click", function () {
      if (confirm("Hapus foto ke-" + foto.id + "?")) {
        daftarFoto.splice(idx, 1);
        render();
      }
    });
    kartu.querySelector(".btn-naik").addEventListener("click", function () {
      if (idx > 0) {
        var tmp = daftarFoto[idx - 1];
        daftarFoto[idx - 1] = daftarFoto[idx];
        daftarFoto[idx] = tmp;
        render();
      }
    });
    kartu.querySelector(".btn-turun").addEventListener("click", function () {
      if (idx < daftarFoto.length - 1) {
        var tmp = daftarFoto[idx + 1];
        daftarFoto[idx + 1] = daftarFoto[idx];
        daftarFoto[idx] = tmp;
        render();
      }
    });
    kartu.querySelector(".btn-ganti").addEventListener("click", function () {
      sedangEditId = foto.id;
      document.getElementById("inputFile").click();
    });

    wadah.appendChild(kartu);
  });

  document.getElementById("btnTambah").disabled = daftarFoto.length >= MAKS_FOTO;
  elStatus(daftarFoto.length + " / " + MAKS_FOTO + " foto");
}

// ==================== AMBIL DATA AWAL DARI TAMPILATOR ====================
function ambilDataAwal() {
  if (!baseUrl) return;
  elStatus("Mengambil data foto dari Tampilator...");
  fetch(baseUrl + "/Get_Photo_Data")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      daftarFoto = (data.photos || []).map(function (p) {
        return {
          id: p.id,
          caption: p.caption || "",
          posisiY: (typeof p.posisi_y === "number") ? p.posisi_y : 90,
          previewUrl: null,
          mainBlob: null,
          thumbBlob: null
        };
      });
      render();
    })
    .catch(function () {
      elStatus("Gagal terhubung ke Tampilator. Cek IP & pastikan 1 WiFi yang sama.");
    });
}

// ==================== SAMBUNG / IP ====================
function sambungkan(ip) {
  baseUrl = "http://" + ip + ":" + PORT;
  ambilDataAwal();
}

document.getElementById("btnSambung").addEventListener("click", function () {
  var ip = document.getElementById("inputIp").value.trim();
  if (ip) sambungkan(ip);
});

function mulaiOtomatis() {
  var ipOtomatis = "";
  try {
    if (window.AndroidBridge && window.AndroidBridge.getTvBoxIp) {
      ipOtomatis = window.AndroidBridge.getTvBoxIp();
    }
  } catch (e) {}

  if (ipOtomatis) {
    document.getElementById("inputIp").value = ipOtomatis;
    sambungkan(ipOtomatis);
  } else {
    elStatus("IP tidak terdeteksi otomatis - isi manual lalu tekan Sambung.");
  }
}

// ==================== TAMBAH / GANTI FOTO ====================
document.getElementById("btnTambah").addEventListener("click", function () {
  if (daftarFoto.length >= MAKS_FOTO) {
    alert("Sudah mencapai maksimal " + MAKS_FOTO + " foto.");
    return;
  }
  sedangEditId = null; // null berarti nambah baru
  document.getElementById("inputFile").click();
});

document.getElementById("inputFile").addEventListener("change", function (e) {
  var file = e.target.files[0];
  e.target.value = ""; // supaya bisa pilih file yang sama lagi nanti
  if (!file) return;

  elStatus("Memproses foto...");

  Promise.all([resizeUtama(file), buatThumbnail(file)]).then(function (hasil) {
    var mainBlob = hasil[0];
    var thumbBlob = hasil[1];
    var previewUrl = URL.createObjectURL(thumbBlob);

    if (sedangEditId === null) {
      var idBaru = idBerikutnya();
      if (idBaru === null) {
        alert("Sudah mencapai maksimal " + MAKS_FOTO + " foto.");
        render();
        return;
      }
      daftarFoto.push({
        id: idBaru,
        caption: "",
        posisiY: 90,
        previewUrl: previewUrl,
        mainBlob: mainBlob,
        thumbBlob: thumbBlob
      });
    } else {
      var foto = daftarFoto.find(function (f) { return f.id === sedangEditId; });
      if (foto) {
        foto.previewUrl = previewUrl;
        foto.mainBlob = mainBlob;
        foto.thumbBlob = thumbBlob;
      }
    }
    render();
  }).catch(function () {
    alert("Gagal memproses foto ini. Coba pilih foto lain.");
    elStatus("");
  });
});

// ==================== SIMPAN (UPLOAD SEMUA) ====================
document.getElementById("btnSimpan").addEventListener("click", function () {
  if (!baseUrl) {
    alert("Belum terhubung ke Tampilator.");
    return;
  }

  var btnSimpan = document.getElementById("btnSimpan");
  var btnTambah = document.getElementById("btnTambah");
  btnSimpan.disabled = true;
  btnTambah.disabled = true;

  var yangPerluUpload = daftarFoto.filter(function (f) { return f.mainBlob || f.thumbBlob; });
  var totalUpload = yangPerluUpload.length;
  var selesai = 0;

  function uploadSatuPerSatu(i) {
    if (i >= yangPerluUpload.length) {
      kirimMetadataPenutup();
      return;
    }
    var foto = yangPerluUpload[i];
    elStatus("Mengunggah foto " + (i + 1) + " / " + totalUpload + "...");

    fetch(baseUrl + "/Send_Photo?id=" + foto.id, { method: "POST", body: foto.mainBlob })
      .then(function () {
        return fetch(baseUrl + "/Send_Photo_Thumb?id=" + foto.id, { method: "POST", body: foto.thumbBlob });
      })
      .then(function () {
        selesai++;
        uploadSatuPerSatu(i + 1);
      })
      .catch(function () {
        alert("Gagal mengunggah foto ke-" + foto.id + ". Coba lagi.");
        btnSimpan.disabled = false;
        btnTambah.disabled = false;
        elStatus("Gagal mengunggah. Periksa koneksi WiFi.");
      });
  }

  function kirimMetadataPenutup() {
    elStatus("Menyimpan urutan & caption...");
    var payload = {
      photos: daftarFoto.map(function (f) {
        return { id: f.id, caption: f.caption || "", posisi_y: f.posisiY };
      })
    };
    fetch(baseUrl + "/Send_Photo_Meta", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function () {
        elStatus("Tersimpan.");
        btnSimpan.disabled = false;
        btnTambah.disabled = daftarFoto.length >= MAKS_FOTO;
        // bersihkan blob pending karena sudah terupload
        daftarFoto.forEach(function (f) { f.mainBlob = null; f.thumbBlob = null; });
      })
      .catch(function () {
        alert("Gagal menyimpan data akhir ke Tampilator.");
        btnSimpan.disabled = false;
        btnTambah.disabled = false;
        elStatus("Gagal menyimpan.");
      });
  }

  uploadSatuPerSatu(0);
});

// ==================== MULAI ====================
mulaiOtomatis();
render();
</script>

</body>
</html>
